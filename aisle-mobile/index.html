<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8f4" />
    <script>
      // Apply the saved appearance before first paint (see src/lib/appearance.ts).
      (function () {
        var theme = 'light';
        try {
          var a = localStorage.getItem('aisle.appearance') || 'system';
          if (
            a === 'dark' ||
            (a === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          )
            theme = 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e1513');
      })();
    </script>
    <title>Aisle — Your grocery companion</title>
    <link rel="icon" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
